AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Description: ServiceForge AI — Serverless AWS Infrastructure Specification (DynamoDB, S3, Cognito, API Gateway, Lambda, CloudWatch, Bedrock IAM)



Parameters:

  Environment:

    Type: String

    Default: prod

    AllowedValues:

      - dev

      - staging

      - prod

    Description: Environment stage name (dev, staging, prod)



  TableName:

    Type: String

    Default: ServiceForge

    Description: Single-table DynamoDB name for ServiceForge AI



  BedrockModelId:

    Type: String

    Default: 'anthropic.claude-3-5-sonnet-20241022-v2:0'

    Description: Amazon Bedrock foundation model identifier for AI diagnostic extraction



Globals:

  Function:

    Timeout: 30

    Runtime: python3.12

    MemorySize: 512

    Environment:

      Variables:

        ENVIRONMENT: !Ref Environment

        DYNAMODB_TABLE_NAME: !Ref ServiceForgeTable

        S3_BUCKET_NAME: !Ref ServiceForgeAttachmentsBucket

        BEDROCK_MODEL_ID: !Ref BedrockModelId

        LOG_LEVEL: INFO



Resources:

  # ============================================================================

  # 1. DYNAMODB SINGLE-TABLE DATASTORE

  # ============================================================================

  ServiceForgeTable:

    Type: AWS::DynamoDB::Table

    Properties:

      TableName: !Ref TableName

      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:

        - AttributeName: PK

          AttributeType: S

        - AttributeName: SK

          AttributeType: S

        - AttributeName: GSI1PK

          AttributeType: S

        - AttributeName: GSI1SK

          AttributeType: S

        - AttributeName: GSI2PK

          AttributeType: S

        - AttributeName: GSI2SK

          AttributeType: S

      KeySchema:

        - AttributeName: PK

          KeyType: HASH

        - AttributeName: SK

          KeyType: RANGE

      GlobalSecondaryIndexes:

        - IndexName: GSI1

          KeySchema:

            - AttributeName: GSI1PK

              KeyType: HASH

            - AttributeName: GSI1SK

              KeyType: RANGE

          Projection:

            ProjectionType: ALL

        - IndexName: GSI2

          KeySchema:

            - AttributeName: GSI2PK

              KeyType: HASH

            - AttributeName: GSI2SK

              KeyType: RANGE

          Projection:

            ProjectionType: ALL

      PointInTimeRecoverySpecification:

        PointInTimeRecoveryEnabled: true

      SSESpecification:

        SSEEnabled: true

      Tags:

        - Key: Environment

          Value: !Ref Environment

        - Key: Project

          Value: ServiceForge-AI



  # ============================================================================

  # 2. AMAZON S3 ATTACHMENTS & REPORT BUCKET

  # ============================================================================

  ServiceForgeAttachmentsBucket:

    Type: AWS::S3::Bucket

    Properties:

      BucketName: !Sub 'serviceforge-ai-attachments-${AWS::AccountId}-${AWS::Region}'

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true

        BlockPublicPolicy: true

        IgnorePublicAcls: true

        RestrictPublicBuckets: true

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:

              SSEAlgorithm: AES256

      CorsConfiguration:

        CorsRules:

          - AllowedHeaders:

              - '*'

            AllowedMethods:

              - GET

              - PUT

              - POST

              - HEAD

            AllowedOrigins:

              - '*'

            MaxAge: 3000

      Tags:

        - Key: Environment

          Value: !Ref Environment

        - Key: Project

          Value: ServiceForge-AI



  # ============================================================================

  # 3. AMAZON COGNITO AUTHENTICATION (USER POOL, CLIENT & RBAC GROUPS)

  # ============================================================================

  ServiceForgeUserPool:

    Type: AWS::Cognito::UserPool

    Properties:

      UserPoolName: !Sub 'serviceforge-user-pool-${Environment}'

      AutoVerifiedAttributes:

        - email

      UsernameAttributes:

        - email

      Policies:

        PasswordPolicy:

          MinimumLength: 8

          RequireLowercase: true

          RequireNumbers: true

          RequireSymbols: false

          RequireUppercase: true

      Schema:

        - Name: email

          AttributeDataType: String

          Required: true

          Mutable: true

        - Name: name

          AttributeDataType: String

          Required: false

          Mutable: true

        - Name: role

          AttributeDataType: String

          DeveloperOnlyAttribute: false

          Mutable: true

          Required: false

        - Name: org_id

          AttributeDataType: String

          DeveloperOnlyAttribute: false

          Mutable: true

          Required: false

      UserPoolTags:

        Environment: !Ref Environment

        Project: ServiceForge-AI



  ServiceForgeUserPoolClient:

    Type: AWS::Cognito::UserPoolClient

    Properties:

      ClientName: !Sub 'serviceforge-web-client-${Environment}'

      UserPoolId: !Ref ServiceForgeUserPool

      GenerateSecret: false

      ExplicitAuthFlows:

        - ALLOW_USER_SRP_AUTH

        - ALLOW_REFRESH_TOKEN_AUTH

        - ALLOW_USER_PASSWORD_AUTH

      PreventUserExistenceErrors: ENABLED

      SupportedIdentityProviders:

        - COGNITO



  # Cognito User Groups for RBAC Roles

  AdminGroup:

    Type: AWS::Cognito::UserPoolGroup

    Properties:

      GroupName: ADMIN

      Description: System Administrators with full operational access

      UserPoolId: !Ref ServiceForgeUserPool



  ServiceManagerGroup:

    Type: AWS::Cognito::UserPoolGroup

    Properties:

      GroupName: SERVICE_MANAGER

      Description: Service Managers approving AI recommendations and dispatches

      UserPoolId: !Ref ServiceForgeUserPool



  DispatcherGroup:

    Type: AWS::Cognito::UserPoolGroup

    Properties:

      GroupName: DISPATCHER

      Description: Dispatchers scheduling and assigning field technicians

      UserPoolId: !Ref ServiceForgeUserPool



  TechnicianGroup:

    Type: AWS::Cognito::UserPoolGroup

    Properties:

      GroupName: TECHNICIAN

      Description: Field Technicians updating job checklists and status

      UserPoolId: !Ref ServiceForgeUserPool



  CustomerGroup:

    Type: AWS::Cognito::UserPoolGroup

    Properties:

      GroupName: CUSTOMER

      Description: Customer portal users creating requests and reviewing reports

      UserPoolId: !Ref ServiceForgeUserPool



  # ============================================================================

  # 4. AMAZON API GATEWAY REST API & AUTHORIZER

  # ============================================================================

  ServiceForgeApi:

    Type: AWS::Serverless::Api

    Properties:

      StageName: !Ref Environment

      Cors:

        AllowMethods: "'GET,POST,PATCH,OPTIONS,PUT,DELETE'"

        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,Accept'"

        AllowOrigin: "'*'"

      GatewayResponses:

        DEFAULT_4XX:

          ResponseParameters:

            Headers:

              Access-Control-Allow-Origin: "'*'"

              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,Accept'"

              Access-Control-Allow-Methods: "'GET,POST,PATCH,OPTIONS,PUT,DELETE'"

        DEFAULT_5XX:

          ResponseParameters:

            Headers:

              Access-Control-Allow-Origin: "'*'"

              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,Accept'"

              Access-Control-Allow-Methods: "'GET,POST,PATCH,OPTIONS,PUT,DELETE'"

      Auth:

        DefaultAuthorizer: CognitoAuthorizer

        AddDefaultAuthorizerToCorsPreflight: false

        Authorizers:

          CognitoAuthorizer:

            UserPoolArn: !GetAtt ServiceForgeUserPool.Arn

            Identity:

              Header: Authorization



  # ============================================================================

  # 5. IAM POLICIES & LEAST-PRIVILEGE EXECUTION ROLES

  # ============================================================================

  BedrockInvocationPolicy:

    Type: AWS::IAM::ManagedPolicy

    Properties:

      ManagedPolicyName: !Sub 'ServiceForgeBedrockPolicy-${Environment}'

      Description: IAM Managed Policy allowing Amazon Bedrock Claude model invocation

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Action:

              - bedrock:InvokeModel

              - bedrock:InvokeModelWithResponseStream

            Resource:

              - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'

              - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'



  ServiceRequestLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub 'ServiceForgeServiceRequestRole-${Environment}'

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service: lambda.amazonaws.com

            Action: sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

        - !Ref BedrockInvocationPolicy

      Policies:

        - PolicyName: DynamoDBAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - dynamodb:GetItem

                  - dynamodb:PutItem

                  - dynamodb:UpdateItem

                  - dynamodb:DeleteItem

                  - dynamodb:Query

                Resource:

                  - !GetAtt ServiceForgeTable.Arn

                  - !Sub '${ServiceForgeTable.Arn}/index/*'

        - PolicyName: S3ServiceRequestAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - s3:GetObject

                Resource:

                  - !Sub '${ServiceForgeAttachmentsBucket.Arn}/*'




  ServiceJobLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub 'ServiceForgeServiceJobRole-${Environment}'

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service: lambda.amazonaws.com

            Action: sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: DynamoDBAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - dynamodb:GetItem

                  - dynamodb:PutItem

                  - dynamodb:UpdateItem

                  - dynamodb:Query

                Resource:

                  - !GetAtt ServiceForgeTable.Arn

                  - !Sub '${ServiceForgeTable.Arn}/index/*'

        - PolicyName: S3Access

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - s3:GetObject

                  - s3:PutObject

                Resource:

                  - !Sub '${ServiceForgeAttachmentsBucket.Arn}/*'



  TechnicianLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub 'ServiceForgeTechnicianRole-${Environment}'

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service: lambda.amazonaws.com

            Action: sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: DynamoDBAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - dynamodb:GetItem

                  - dynamodb:PutItem

                  - dynamodb:Query

                Resource:

                  - !GetAtt ServiceForgeTable.Arn

                  - !Sub '${ServiceForgeTable.Arn}/index/*'



  ReportLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub 'ServiceForgeReportRole-${Environment}'

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service: lambda.amazonaws.com

            Action: sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

        - !Ref BedrockInvocationPolicy

      Policies:

        - PolicyName: DynamoDBAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - dynamodb:GetItem

                  - dynamodb:PutItem

                  - dynamodb:Query

                Resource:

                  - !GetAtt ServiceForgeTable.Arn

                  - !Sub '${ServiceForgeTable.Arn}/index/*'

        - PolicyName: S3Access

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - s3:GetObject

                  - s3:PutObject

                Resource:

                  - !Sub '${ServiceForgeAttachmentsBucket.Arn}/*'



  AttachmentLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub 'ServiceForgeAttachmentRole-${Environment}'

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service: lambda.amazonaws.com

            Action: sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: DynamoDBAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - dynamodb:GetItem

                  - dynamodb:PutItem

                  - dynamodb:UpdateItem

                  - dynamodb:DeleteItem

                  - dynamodb:Query

                Resource:

                  - !GetAtt ServiceForgeTable.Arn

                  - !Sub '${ServiceForgeTable.Arn}/index/*'

        - PolicyName: S3AttachmentAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub '${ServiceForgeAttachmentsBucket.Arn}/*'

  CustomerLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub 'ServiceForgeCustomerRole-${Environment}'

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service: lambda.amazonaws.com

            Action: sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: DynamoDBAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - dynamodb:GetItem

                  - dynamodb:PutItem

                  - dynamodb:Query

                Resource:

                  - !GetAtt ServiceForgeTable.Arn

                  - !Sub '${ServiceForgeTable.Arn}/index/*'



  AssetLambdaRole:

    Type: AWS::IAM::Role

    Properties:

      RoleName: !Sub 'ServiceForgeAssetRole-${Environment}'

      AssumeRolePolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Effect: Allow

            Principal:

              Service: lambda.amazonaws.com

            Action: sts:AssumeRole

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:

        - PolicyName: DynamoDBAccess

          PolicyDocument:

            Version: '2012-10-17'

            Statement:

              - Effect: Allow

                Action:

                  - dynamodb:GetItem

                  - dynamodb:PutItem

                  - dynamodb:Query

                Resource:

                  - !GetAtt ServiceForgeTable.Arn

                  - !Sub '${ServiceForgeTable.Arn}/index/*'



  # ============================================================================

  # 6. AWS LAMBDA MICROSERVICES FOUNDATION & SHARED LAYER

  # ============================================================================

  ServiceForgeSharedLayer:

    Type: AWS::Serverless::LayerVersion

    Properties:

      LayerName: !Sub 'serviceforge-shared-layer-${Environment}'

      Description: Shared Python modules for ServiceForge AI (shared.auth, shared.responses, shared.dynamodb, etc.)

      ContentUri: ../Backend/shared_layer/

      CompatibleRuntimes:

        - python3.12

      RetentionPolicy: Retain



  ServiceRequestFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: ../Backend/functions/service-request/

      Handler: handler.lambda_handler

      Role: !GetAtt ServiceRequestLambdaRole.Arn

      Layers:

        - !Ref ServiceForgeSharedLayer

      Events:

        OptionsServiceRequests:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-requests

            Method: options

            Auth:

              Authorizer: NONE

        OptionsServiceRequestsId:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-requests/{id}

            Method: options

            Auth:

              Authorizer: NONE

        OptionsServiceRequestsAnalyze:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-requests/{id}/analyze

            Method: options

            Auth:

              Authorizer: NONE

        CreateRequest:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-requests

            Method: post

        ListRequests:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-requests

            Method: get

        GetRequest:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-requests/{id}

            Method: get

        PatchRequest:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-requests/{id}

            Method: patch

        AnalyzeRequest:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-requests/{id}/analyze

            Method: post



  ServiceJobFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: ../Backend/functions/service-job/

      Handler: handler.lambda_handler

      Role: !GetAtt ServiceJobLambdaRole.Arn

      Layers:

        - !Ref ServiceForgeSharedLayer

      Events:

        OptionsServiceJobs:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs

            Method: options

            Auth:

              Authorizer: NONE

        OptionsServiceJobsId:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs/{id}

            Method: options

            Auth:

              Authorizer: NONE

        OptionsServiceJobsAssign:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs/{id}/assign

            Method: options

            Auth:

              Authorizer: NONE

        OptionsServiceJobsUpdates:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs/{id}/updates

            Method: options

            Auth:

              Authorizer: NONE

        OptionsServiceJobsComplete:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs/{id}/complete

            Method: options

            Auth:

              Authorizer: NONE

        CreateJob:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs

            Method: post

        ListJobs:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs

            Method: get

        GetJob:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs/{id}

            Method: get

        AssignJob:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs/{id}/assign

            Method: post

        AddJobUpdate:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs/{id}/updates

            Method: post

        CompleteJob:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs/{id}/complete

            Method: post



  TechnicianFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: ../Backend/functions/technician/

      Handler: handler.lambda_handler

      Role: !GetAtt TechnicianLambdaRole.Arn

      Layers:

        - !Ref ServiceForgeSharedLayer

      Events:

        OptionsTechnicians:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /technicians

            Method: options

            Auth:

              Authorizer: NONE

        OptionsTechniciansId:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /technicians/{id}

            Method: options

            Auth:

              Authorizer: NONE

        ListTechnicians:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /technicians

            Method: get

        GetTechnician:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /technicians/{id}

            Method: get



  ReportFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: ../Backend/functions/report/

      Handler: handler.lambda_handler

      Role: !GetAtt ReportLambdaRole.Arn

      Layers:

        - !Ref ServiceForgeSharedLayer

      Events:

        OptionsReportGenerate:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs/{id}/report/generate

            Method: options

            Auth:

              Authorizer: NONE

        OptionsReport:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs/{id}/report

            Method: options

            Auth:

              Authorizer: NONE

        GenerateReport:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs/{id}/report/generate

            Method: post

        GetReport:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /service-jobs/{id}/report

            Method: get



  AttachmentFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: ../Backend/functions/attachment/

      Handler: handler.lambda_handler

      Role: !GetAtt AttachmentLambdaRole.Arn

      Layers:

        - !Ref ServiceForgeSharedLayer

      Events:

        OptionsAttachmentPresign:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /attachments/presign

            Method: options

            Auth:

              Authorizer: NONE

        OptionsAttachmentConfirm:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /attachments/{id}/confirm

            Method: options

            Auth:

              Authorizer: NONE

        OptionsAttachmentDelete:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /attachments/{id}

            Method: options

            Auth:

              Authorizer: NONE

        PresignAttachment:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /attachments/presign

            Method: post

        ConfirmAttachment:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /attachments/{id}/confirm

            Method: post

        DeleteAttachment:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /attachments/{id}

            Method: delete



  CustomerFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: ../Backend/functions/customer/

      Handler: handler.lambda_handler

      Role: !GetAtt CustomerLambdaRole.Arn

      Layers:

        - !Ref ServiceForgeSharedLayer

      Events:

        OptionsCustomers:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /customers

            Method: options

            Auth:

              Authorizer: NONE

        OptionsCustomersId:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /customers/{id}

            Method: options

            Auth:

              Authorizer: NONE

        ListCustomers:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /customers

            Method: get

        GetCustomer:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /customers/{id}

            Method: get



  AssetFunction:

    Type: AWS::Serverless::Function

    Properties:

      CodeUri: ../Backend/functions/asset/

      Handler: handler.lambda_handler

      Role: !GetAtt AssetLambdaRole.Arn

      Layers:

        - !Ref ServiceForgeSharedLayer

      Events:

        OptionsAssets:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /assets

            Method: options

            Auth:

              Authorizer: NONE

        OptionsAssetsId:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /assets/{id}

            Method: options

            Auth:

              Authorizer: NONE

        ListAssets:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /assets

            Method: get

        GetAsset:

          Type: Api

          Properties:

            RestApiId: !Ref ServiceForgeApi

            Path: /assets/{id}

            Method: get



  # ============================================================================

  # 7. AMAZON CLOUDWATCH LOG GROUPS & ALARMS

  # ============================================================================

  ServiceRequestLogGroup:

    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName: !Sub '/aws/lambda/${ServiceRequestFunction}'

      RetentionInDays: 30



  ServiceJobLogGroup:

    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName: !Sub '/aws/lambda/${ServiceJobFunction}'

      RetentionInDays: 30



  TechnicianLogGroup:

    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName: !Sub '/aws/lambda/${TechnicianFunction}'

      RetentionInDays: 30



  ReportLogGroup:

    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName: !Sub '/aws/lambda/${ReportFunction}'

      RetentionInDays: 30



  AttachmentLogGroup:

    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName: !Sub '/aws/lambda/${AttachmentFunction}'

      RetentionInDays: 30



  Api5xxErrorAlarm:

    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName: !Sub 'ServiceForgeApi5xxErrors-${Environment}'

      AlarmDescription: Triggered when API Gateway returns > 5 error responses in 5 minutes

      MetricName: 5XXError

      Namespace: AWS/ApiGateway

      Statistic: Sum

      Period: 300

      EvaluationPeriods: 1

      Threshold: 5

      ComparisonOperator: GreaterThanThreshold

      Dimensions:

        - Name: ApiName

          Value: !Ref ServiceForgeApi



# ============================================================================

# 8. OUTPUTS

# ============================================================================

Outputs:

  ServiceForgeApiUrl:

    Description: Base HTTP URL for ServiceForge API Gateway Stage

    Value: !Sub 'https://${ServiceForgeApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'

    Export:

      Name: !Sub 'ServiceForgeApiUrl-${Environment}'



  UserPoolId:

    Description: Amazon Cognito User Pool ID

    Value: !Ref ServiceForgeUserPool

    Export:

      Name: !Sub 'ServiceForgeUserPoolId-${Environment}'



  UserPoolClientId:

    Description: Amazon Cognito User Pool Client ID

    Value: !Ref ServiceForgeUserPoolClient

    Export:

      Name: !Sub 'ServiceForgeUserPoolClientId-${Environment}'



  DynamoDBTableName:

    Description: Single-Table DynamoDB Data Store Name

    Value: !Ref ServiceForgeTable

    Export:

      Name: !Sub 'ServiceForgeTableName-${Environment}'



  S3AttachmentsBucketName:

    Description: S3 Bucket Name for Private Attachments & Reports

    Value: !Ref ServiceForgeAttachmentsBucket

    Export:

      Name: !Sub 'ServiceForgeBucketName-${Environment}'
