AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ServiceForge AI — Serverless AWS Infrastructure Specification (DynamoDB, S3, Cognito, API Gateway, Lambda, CloudWatch, Bedrock IAM)

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment stage name (dev, staging, prod)

  TableName:
    Type: String
    Default: ServiceForge
    Description: Single-table DynamoDB name for ServiceForge AI

  BedrockModelId:
    Type: String
    Default: 'anthropic.claude-3-5-sonnet-20241022-v2:0'
    Description: Amazon Bedrock foundation model identifier for AI diagnostic extraction

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    MemorySize: 512
    Environment:
      Variables:
        AWS_REGION: !Ref AWS::Region
        ENVIRONMENT: !Ref Environment
        DYNAMODB_TABLE_NAME: !Ref ServiceForgeTable
        S3_BUCKET_NAME: !Ref ServiceForgeAttachmentsBucket
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        LOG_LEVEL: INFO

Resources:
  # ============================================================================
  # 1. DYNAMODB SINGLE-TABLE DATASTORE
  # ============================================================================
  ServiceForgeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: ServiceForge-AI

  # ============================================================================
  # 2. AMAZON S3 ATTACHMENTS & REPORT BUCKET
  # ============================================================================
  ServiceForgeAttachmentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'serviceforge-ai-attachments-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
            AllowedOrigins:
              - '*'
            MaxAge: 3000
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: ServiceForge-AI

  # ============================================================================
  # 3. AMAZON COGNITO AUTHENTICATION (USER POOL, CLIENT & RBAC GROUPS)
  # ============================================================================
  ServiceForgeUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'serviceforge-user-pool-${Environment}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: role
          AttributeDataType: String
          DeveloperOnlyAttribute: false
          Mutable: true
          Required: false
        - Name: org_id
          AttributeDataType: String
          DeveloperOnlyAttribute: false
          Mutable: true
          Required: false
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: ServiceForge-AI

  ServiceForgeUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'serviceforge-web-client-${Environment}'
      UserPoolId: !Ref ServiceForgeUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO

  # Cognito User Groups for RBAC Roles
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: ADMIN
      Description: System Administrators with full operational access
      UserPoolId: !Ref ServiceForgeUserPool

  ServiceManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: SERVICE_MANAGER
      Description: Service Managers approving AI recommendations and dispatches
      UserPoolId: !Ref ServiceForgeUserPool

  DispatcherGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: DISPATCHER
      Description: Dispatchers scheduling and assigning field technicians
      UserPoolId: !Ref ServiceForgeUserPool

  TechnicianGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: TECHNICIAN
      Description: Field Technicians updating job checklists and status
      UserPoolId: !Ref ServiceForgeUserPool

  CustomerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: CUSTOMER
      Description: Customer portal users creating requests and reviewing reports
      UserPoolId: !Ref ServiceForgeUserPool

  # ============================================================================
  # 4. AMAZON API GATEWAY REST API & AUTHORIZER
  # ============================================================================
  ServiceForgeApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PATCH,OPTIONS,PUT,DELETE'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt ServiceForgeUserPool.Arn
            Identity:
              Header: Authorization

  # ============================================================================
  # 5. IAM POLICIES & LEAST-PRIVILEGE EXECUTION ROLES
  # ============================================================================
  BedrockInvocationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'ServiceForgeBedrockPolicy-${Environment}'
      Description: IAM Managed Policy allowing Amazon Bedrock Claude model invocation
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}'
              - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-haiku-20240307-v1:0'

  ServiceRequestLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ServiceForgeServiceRequestRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref BedrockInvocationPolicy
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt ServiceForgeTable.Arn
                  - !Sub '${ServiceForgeTable.Arn}/index/*'

  ServiceJobLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ServiceForgeServiceJobRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt ServiceForgeTable.Arn
                  - !Sub '${ServiceForgeTable.Arn}/index/*'
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub '${ServiceForgeAttachmentsBucket.Arn}/*'

  TechnicianLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ServiceForgeTechnicianRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt ServiceForgeTable.Arn
                  - !Sub '${ServiceForgeTable.Arn}/index/*'

  ReportLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ServiceForgeReportRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref BedrockInvocationPolicy
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt ServiceForgeTable.Arn
                  - !Sub '${ServiceForgeTable.Arn}/index/*'
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub '${ServiceForgeAttachmentsBucket.Arn}/*'

  # ============================================================================
  # 6. AWS LAMBDA MICROSERVICES FOUNDATION
  # ============================================================================
  ServiceRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../Backend/functions/service-request/
      Handler: handler.lambda_handler
      Role: !GetAtt ServiceRequestLambdaRole.Arn
      Events:
        CreateRequest:
          Type: Api
          Properties:
            RestApiId: !Ref ServiceForgeApi
            Path: /service-requests
            Method: post
        ListRequests:
          Type: Api
          Properties:
            RestApiId: !Ref ServiceForgeApi
            Path: /service-requests
            Method: get
        GetRequest:
          Type: Api
          Properties:
            RestApiId: !Ref ServiceForgeApi
            Path: /service-requests/{id}
            Method: get
        AnalyzeRequest:
          Type: Api
          Properties:
            RestApiId: !Ref ServiceForgeApi
            Path: /service-requests/{id}/analyze
            Method: post

  ServiceJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../Backend/functions/service-job/
      Handler: handler.lambda_handler
      Role: !GetAtt ServiceJobLambdaRole.Arn
      Events:
        CreateJob:
          Type: Api
          Properties:
            RestApiId: !Ref ServiceForgeApi
            Path: /service-jobs
            Method: post
        ListJobs:
          Type: Api
          Properties:
            RestApiId: !Ref ServiceForgeApi
            Path: /service-jobs
            Method: get
        GetJob:
          Type: Api
          Properties:
            RestApiId: !Ref ServiceForgeApi
            Path: /service-jobs/{id}
            Method: get
        AssignJob:
          Type: Api
          Properties:
            RestApiId: !Ref ServiceForgeApi
            Path: /service-jobs/{id}/assign
            Method: post
        AddJobUpdate:
          Type: Api
          Properties:
            RestApiId: !Ref ServiceForgeApi
            Path: /service-jobs/{id}/updates
            Method: post

  TechnicianFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../Backend/functions/technician/
      Handler: handler.lambda_handler
      Role: !GetAtt TechnicianLambdaRole.Arn
      Events:
        ListTechnicians:
          Type: Api
          Properties:
            RestApiId: !Ref ServiceForgeApi
            Path: /technicians
            Method: get
        GetTechnician:
          Type: Api
          Properties:
            RestApiId: !Ref ServiceForgeApi
            Path: /technicians/{id}
            Method: get

  ReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../Backend/functions/report/
      Handler: handler.lambda_handler
      Role: !GetAtt ReportLambdaRole.Arn
      Events:
        GenerateReport:
          Type: Api
          Properties:
            RestApiId: !Ref ServiceForgeApi
            Path: /service-jobs/{id}/report/generate
            Method: post
        GetReport:
          Type: Api
          Properties:
            RestApiId: !Ref ServiceForgeApi
            Path: /service-jobs/{id}/report
            Method: get

  # ============================================================================
  # 7. AMAZON CLOUDWATCH LOG GROUPS & ALARMS
  # ============================================================================
  ServiceRequestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ServiceRequestFunction}'
      RetentionInDays: 30

  ServiceJobLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ServiceJobFunction}'
      RetentionInDays: 30

  TechnicianLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${TechnicianFunction}'
      RetentionInDays: 30

  ReportLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ReportFunction}'
      RetentionInDays: 30

  Api5xxErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ServiceForgeApi5xxErrors-${Environment}'
      AlarmDescription: Triggered when API Gateway returns > 5 error responses in 5 minutes
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Ref ServiceForgeApi

# ============================================================================
# 8. OUTPUTS
# ============================================================================
Outputs:
  ServiceForgeApiUrl:
    Description: Base HTTP URL for ServiceForge API Gateway Stage
    Value: !Sub 'https://${ServiceForgeApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub 'ServiceForgeApiUrl-${Environment}'

  UserPoolId:
    Description: Amazon Cognito User Pool ID
    Value: !Ref ServiceForgeUserPool
    Export:
      Name: !Sub 'ServiceForgeUserPoolId-${Environment}'

  UserPoolClientId:
    Description: Amazon Cognito User Pool Client ID
    Value: !Ref ServiceForgeUserPoolClient
    Export:
      Name: !Sub 'ServiceForgeUserPoolClientId-${Environment}'

  DynamoDBTableName:
    Description: Single-Table DynamoDB Data Store Name
    Value: !Ref ServiceForgeTable
    Export:
      Name: !Sub 'ServiceForgeTableName-${Environment}'

  S3AttachmentsBucketName:
    Description: S3 Bucket Name for Private Attachments & Reports
    Value: !Ref ServiceForgeAttachmentsBucket
    Export:
      Name: !Sub 'ServiceForgeBucketName-${Environment}'
